<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Vehicle Inspection</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
        }
        video, canvas {
            width: 100%;
            border-radius: 8px;
            border: 2px dashed #444;
            background: #000;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .rejected { color: #ff4d4d; }
        .passed { color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Live Vehicle Inspection</h2>
        <p style="color: #aaa; font-size: 12px;">Hardware locked live capture engine</p>
        
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>

        <button id="scan-btn" onclick="captureAndVerify()">SCAN DAMAGE (STEP 1: TILT PHONE)</button>

        <div id="result"></div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const resultDiv = document.getElementById('result');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { resultDiv.innerText = "Camera access denied or unavailable."; });

        async function captureAndVerify() {
            resultDiv.className = "";
            resultDiv.innerText = "Analyzing live stream & anti-spoofing checks...";

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const blob1 = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));

            await new Promise(r => setTimeout(r, 600));
            ctx.drawImage(video, 0, 0);
            const blob2 = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));

            const formData = new FormData();
            formData.append('frame1', blob1, 'frame1.jpg');
            formData.append('frame2', blob2, 'frame2.jpg');

            try {
                const response = await fetch('/verify', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = "passed";
                    resultDiv.innerText = `PASSED: Authenticity Confirmed (Displacement: ${data.details.displacement_score})`;
                } else {
                    resultDiv.className = "rejected";
                    resultDiv.innerText = data.message || "REJECTED: Verification failed.";
                }
            } catch (err) {
                resultDiv.className = "rejected";
                resultDiv.innerText = "Server connection error.";
            }
        }
    </script>
</body>
</html>
