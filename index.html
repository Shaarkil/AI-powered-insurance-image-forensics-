<!DOCTYPE html>
<html>
<head><title>Insurance Forensics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0f172a;color:white;font-family:sans-serif;text-align:center;padding:20px}
.box{background:#1e293b;padding:20px;border-radius:16px;max-width:500px;margin:auto}
button{background:#3b82f6;color:white;padding:12px 24px;border:none;border-radius:8px;font-size:16px}
</style>
</head>
<body>
<h1>AI-Powered Insurance Image Forensics</h1>
<p>Detects Fraud, Tampering & AI-generated claims</p>
<div class="box">
<form action="/analyze" method="post" enctype="multipart/form-data">
<input type="file" name="file" accept="image/*" required><br><br>
<button type="submit">Analyze Image</button>
</form>
</div>
</body>
</html>
